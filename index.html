<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUIPUX SQL Visual Query & Charts</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="dashboard-container">
        <header>
            <h1>QUIPUX SQL Terminal & Analytics</h1>
            <p>Escribe o selecciona una consulta SQL para ver la tabla de datos y su gráfico correspondiente</p>
        </header>

        <!-- CONSOLA DE QUERIES -->
        <div class="console-box">
            <h2>Consola de Consultas SQL</h2>
            <div class="query-shortcuts">
                <button class="btn-shortcut" onclick="setQuery('SELECT estado_solicitud, COUNT(id_solicitud) FROM solicitud GROUP BY estado_solicitud')">Conteo por Estado</button>
                <button class="btn-shortcut" onclick="setQuery('SELECT tipo_exencion.nombre_exencion, COUNT(solicitud.id_solicitud) FROM solicitud JOIN tipo_exencion ON solicitud.id_tipo_exencion = tipo_exencion.id_tipo_exencion GROUP BY tipo_exencion.nombre_exencion')">Exenciones más Pedidas</button>
                <button class="btn-shortcut" onclick="setQuery('SELECT funcionario.nombre_funcionario, COUNT(solicitud.id_solicitud) FROM solicitud JOIN funcionario ON solicitud.id_funcionario_gestor = funcionario.id_funcionario GROUP BY funcionario.nombre_funcionario')">Carga por Funcionario</button>
            </div>
            
            <div class="query-input-wrapper">
                <textarea id="sql-input" placeholder="Escribe tu consulta SQL aquí... (Ej: SELECT ...)">SELECT estado_solicitud, COUNT(id_solicitud) FROM solicitud GROUP BY estado_solicitud</textarea>
                <button class="btn-execute" onclick="executeSQLQuery()">Ejecutar Query</button>
            </div>
        </div>

        <!-- RESULTADOS: TABLA Y GRÁFICO DINÁMICO -->
        <div class="results-grid">
            <!-- Columna de Datos (Tabla) -->
            <div class="card-result">
                <h3>Resultado de la Tabla</h3>
                <div class="table-responsive">
                    <table id="dynamic-table">
                        <thead></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <!-- Columna de Gráfico Visual -->
            <div class="card-result">
                <h3>Representación Gráfica</h3>
                <div id="chart-container" class="chart-container">
                    <p class="placeholder-text">Ejecuta una consulta para ver el gráfico</p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
